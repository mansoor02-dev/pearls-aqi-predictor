[project]
name = "pearls-aqi-predictor"
version = "0.1.0"
description = "Production-grade AQI forecasting with MLOps"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]

dependencies = [
    # Core
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # API & HTTP
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    # Feature Store
    "hopsworks>=3.4.0",
    # ML
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    # App
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    # Explainability
    "shap>=0.43.0",
    "lime>=0.2.0",
    # Monitoring
    "evidently>=0.4.0",
    # Utils
    "python-json-logger>=2.0.7",
    "geopy>=2.4.0",
    "pathlib>=1.0.1",
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "ipykernel>=7.3.0",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
feature-pipeline = "scripts.run_feature_pipeline:main"
training-pipeline = "scripts.run_training_pipeline:main"
backfill = "scripts.run_backfill:main"


[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = true
